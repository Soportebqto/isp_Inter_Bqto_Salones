<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Inter Bqto - Gestión FTTH</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Omnivore -->
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.2.0/leaflet-omnivore.min.js'></script>
    <style>
        #map { height: calc(100vh - 5rem); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-wrap justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold text-sky-400 flex items-center gap-2">
                📡 ISP Inter Bqto
            </h1>
            <p class="text-xs text-slate-400">Gestión de Fibra Óptica FTTH & Redes Bqto-Cabudare</p>
        </div>
        
        <div class="flex items-center gap-2 mt-2 sm:mt-0 flex-wrap">
            <!-- Selector de Modo -->
            <div class="bg-slate-700 p-1 rounded-lg flex items-center border border-slate-600">
                <span class="text-xs text-slate-300 px-2 font-medium">Modo:</span>
                <select id="appMode" class="bg-slate-800 text-sky-300 text-xs font-semibold px-2 py-1 rounded focus:outline-none">
                    <option value="edit">🛠️ Edición (Completo)</option>
                    <option value="view">👁️ Solo Visual (Técnicos)</option>
                </select>
            </div>

            <!-- Botón KML My Maps -->
            <label class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition shadow cursor-pointer" title="Sube el archivo .kml de Google My Maps">
                🌍 Importar KML My Maps
                <input type="file" id="importKmlFile" class="hidden" accept=".kml,.kmz" onchange="importKmlMyMaps(event)">
            </label>

            <!-- Botones de Respaldo JSON -->
            <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition shadow">
                💾 Exportar JSON
            </button>
            <label class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded transition shadow cursor-pointer">
                📂 Importar JSON
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </label>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
        
        <!-- Sidebar / Panel de Control -->
        <div id="sidebar" class="w-full lg:w-96 bg-slate-800 border-r border-slate-700 p-4 overflow-y-auto flex flex-col gap-4">
            
            <!-- Selector de Tipo de Registro -->
            <div id="editControlsContainer" class="flex flex-col gap-4">
                <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-600">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">¿Qué deseas registrar en el mapa?</label>
                    <select id="elementType" class="w-full bg-slate-700 text-white text-sm rounded p-2 border border-slate-600 focus:outline-none focus:border-sky-400">
                        <option value="fdt">Nodo FDT (Terminal de Distribución)</option>
                        <option value="nap">Caja NAP (Distribución de Manzana)</option>
                        <option value="house">Casa / Inmueble / Cliente</option>
                        <option value="drop">Trazar Drop (Acometida a Casa)</option>
                    </select>
                </div>

                <!-- Formulario Dinámico -->
                <div id="formContainer" class="bg-slate-700/30 p-3 rounded-lg border border-slate-600/50 text-sm"></div>

                <div class="flex gap-2">
                    <button onclick="saveElement()" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 px-4 rounded text-sm transition shadow">
                        Registrar en Coordenada
                    </button>
                    <button onclick="clearMarkers()" class="bg-rose-600/80 hover:bg-rose-500 text-white text-xs py-2 px-3 rounded transition" title="Borrar todo localmente">
                        🗑️ Limpiar
                    </button>
                </div>
            </div>

            <!-- Panel Informativo Modo Visual -->
            <div id="viewModeMessage" class="hidden bg-sky-900/30 border border-sky-600/40 p-3 rounded-lg text-xs text-sky-200">
                ℹ️ <strong>Modo Visual Activo:</strong> Estás navegando en modo de solo lectura. Haz clic en los elementos para ver su información.
            </div>

            <!-- Filtros de Visualización -->
            <div class="bg-slate-700/40 p-3 rounded-lg border border-slate-600 text-xs flex flex-col gap-2">
                <span class="font-semibold text-slate-300">Filtros de Capas:</span>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="filterFdt" checked onchange="updateLayers()" class="rounded bg-slate-900 border-slate-600 text-sky-500"> Ver Nodos FDT</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="filterNap" checked onchange="updateLayers()" class="rounded bg-slate-900 border-slate-600 text-sky-500"> Ver Cajas NAP</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="filterHouse" checked onchange="updateLayers()" class="rounded bg-slate-900 border-slate-600 text-sky-500"> Ver Casas / Clientes</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="filterDrop" checked onchange="updateLayers()" class="rounded bg-slate-900 border-slate-600 text-sky-500"> Ver Acometidas (Drops)</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="filterKml" checked onchange="toggleKmlLayer()" class="rounded bg-slate-900 border-slate-600 text-amber-500"> Ver Trazas KML Importadas</label>
            </div>

            <div class="bg-slate-900/60 p-2.5 rounded border border-slate-700 text-xs text-slate-400">
                <span class="font-semibold text-slate-300">Punto seleccionado en mapa:</span>
                <div id="selectedCoords" class="text-sky-400 font-mono mt-1">Haz clic en el mapa...</div>
            </div>

        </div>

        <!-- Mapa Container -->
        <div id="map" class="flex-1 z-0"></div>

    </div>

    <!-- Script de la Aplicación -->
    <script>
        const defaultLat = 10.0678;
        const defaultLng = -69.3473;

        let map = L.map('map').setView([defaultLat, defaultLng], 14);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, GIS User Community',
            maxZoom: 19
        }).addTo(map);

        let selectedLat = null;
        let selectedLng = null;
        let tempMarker = null;

        let networkData = JSON.parse(localStorage.getItem('isp_inter_bqto_data')) || {
            fdts: [],
            naps: [],
            houses: [],
            drops: [],
            kmlItems: []
        };

        let mapLayers = L.layerGroup().addTo(map);
        let kmlImportLayer = L.layerGroup().addTo(map);
        let currentMode = 'edit';

        document.getElementById('appMode').addEventListener('change', function(e) {
            currentMode = e.target.value;
            const editControls = document.getElementById('editControlsContainer');
            const viewMsg = document.getElementById('viewModeMessage');

            if (currentMode === 'view') {
                editControls.classList.add('hidden');
                viewMsg.classList.remove('hidden');
                if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
                document.getElementById('selectedCoords').innerText = "Modo Solo Visualización activado.";
            } else {
                editControls.classList.remove('hidden');
                viewMsg.classList.add('hidden');
            }
        });

        const elementTypeSelect = document.getElementById('elementType');
        elementTypeSelect.addEventListener('change', renderForm);

        function renderForm() {
            const type = elementTypeSelect.value;
            const container = document.getElementById('formContainer');
            
            if (type === 'fdt') {
                container.innerHTML = `
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nomenclatura FDT:</label>
                    <input type="text" id="fdtName" placeholder="Ej: FDT-ESTESTE-01" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 mb-2">
                    <label class="block text-xs font-medium text-slate-300 mb-1">Capacidad Hilos / Troncal:</label>
                    <input type="text" id="fdtFeeder" placeholder="Ej: Feeder 48H" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600">
                `;
            } else if (type === 'nap') {
                let fdtOptions = networkData.fdts.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
                if(!fdtOptions) fdtOptions = `<option value="Principal">Principal</option>`;
                container.innerHTML = `
                    <label class="block text-xs font-medium text-slate-300 mb-1">Código NAP:</label>
                    <input type="text" id="napName" placeholder="Ej: NAP-M12-C04" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 mb-2">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Manzana:</label><input type="text" id="napBlock" placeholder="Ej: M-12" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"></div>
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Puertos:</label><select id="napPorts" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"><option value="8">8</option><option value="16" selected>16</option></select></div>
                    </div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">FDT Asociado:</label>
                    <select id="napFdt" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600">${fdtOptions}</select>
                `;
            } else if (type === 'house') {
                container.innerHTML = `
                    <label class="block text-xs font-medium text-slate-300 mb-1">Cliente / Inmueble:</label>
                    <input type="text" id="houseClient" placeholder="Ej: Edgar Salones" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 mb-2">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Manzana:</label><input type="text" id="houseBlock" placeholder="Ej: 12" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"></div>
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Casa:</label><input type="text" id="houseNumber" placeholder="Ej: #45" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"></div>
                    </div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Estado:</label>
                    <select id="houseStatus" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600">
                        <option value="Activo">🟢 Activo</option>
                        <option value="Disponible">🔵 Disponible</option>
                        <option value="Pendiente">🟡 Pendiente</option>
                    </select>
                `;
            } else if (type === 'drop') {
                let napOptions = networkData.naps.map(n => `<option value="${n.name}">${n.name}</option>`).join('');
                let houseOptions = networkData.houses.map(h => `<option value="${h.client} (M:${h.block} C:${h.houseNum})">${h.client}</option>`).join('');
                
                if(!napOptions || !houseOptions) {
                    container.innerHTML = `<p class="text-amber-400 text-xs">⚠️ Registra una NAP y una Casa primero.</p>`;
                    return;
                }
                container.innerHTML = `
                    <label class="block text-xs font-medium text-slate-300 mb-1">NAP Origen:</label>
                    <select id="dropNap" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 mb-2">${napOptions}</select>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Casa Destino:</label>
                    <select id="dropHouse" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600 mb-2">${houseOptions}</select>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Puerto:</label><input type="text" id="dropPort" placeholder="Ej: P-04" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"></div>
                        <div><label class="block text-xs font-medium text-slate-300 mb-1">Metraje:</label><input type="text" id="dropMeters" placeholder="Ej: 120m" class="w-full bg-slate-800 text-white text-xs p-2 rounded border border-slate-600"></div>
                    </div>
                `;
            }
        }
        renderForm();

        map.on('click', function(e) {
            if (currentMode === 'view') return;
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;
            document.getElementById('selectedCoords').innerText = `Lat: ${selectedLat.toFixed(5)}, Lng: ${selectedLng.toFixed(5)}`;
            if (tempMarker) map.removeLayer(tempMarker);
            tempMarker = L.marker([selectedLat, selectedLng], {
                icon: L.divIcon({ className: 'temp', html: '<div style="background:#38bdf8; width:14px; height:14px; border-radius:50%; border:2px solid white;"></div>' })
            }).addTo(map);
        });

        function saveElement() {
            if (currentMode === 'view') return;
            const type = elementTypeSelect.value;
            if (type !== 'drop' && (!selectedLat || !selectedLng)) { alert('Haz clic en el mapa primero.'); return; }

            if (type === 'fdt') {
                const name = document.getElementById('fdtName').value.trim();
                const feeder = document.getElementById('fdtFeeder').value.trim();
                if(!name) { alert('Falta nombre'); return; }
                networkData.fdts.push({ name, feeder, lat: selectedLat, lng: selectedLng });
            } else if (type === 'nap') {
                const name = document.getElementById('napName').value.trim();
                const block = document.getElementById('napBlock').value.trim();
                const ports = document.getElementById('napPorts').value;
                const fdt = document.getElementById('napFdt').value;
                if(!name) { alert('Falta nombre'); return; }
                networkData.naps.push({ name, block, ports, fdt, lat: selectedLat, lng: selectedLng });
            } else if (type === 'house') {
                const client = document.getElementById('houseClient').value.trim();
                const block = document.getElementById('houseBlock').value.trim();
                const houseNum = document.getElementById('houseNumber').value.trim();
                const status = document.getElementById('houseStatus').value;
                if(!client) { alert('Falta cliente'); return; }
                networkData.houses.push({ client, block, houseNum, status, lat: selectedLat, lng: selectedLng });
            } else if (type === 'drop') {
                const napName = document.getElementById('dropNap').value;
                const houseName = document.getElementById('dropHouse').value;
                const port = document.getElementById('dropPort').value.trim();
                const meters = document.getElementById('dropMeters').value.trim();
                const napObj = networkData.naps.find(n => n.name === napName);
                const houseObj = networkData.houses.find(h => `${h.client} (M:${h.block} C:${h.houseNum})` === houseName);
                if(!napObj || !houseObj) { alert('Error buscando NAP o Casa'); return; }
                networkData.drops.push({ napName, houseName, port, meters, from: [napObj.lat, napObj.lng], to: [houseObj.lat, houseObj.lng] });
            }

            localStorage.setItem('isp_inter_bqto_data', JSON.stringify(networkData));
            if(tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
            selectedLat = null; selectedLng = null;
            document.getElementById('selectedCoords').innerText = "Guardado con éxito.";
            renderForm();
            updateLayers();
        }

        function updateLayers() {
            mapLayers.clearLayers();
            const showFdt = document.getElementById('filterFdt').checked;
            const showNap = document.getElementById('filterNap').checked;
            const showHouse = document.getElementById('filterHouse').checked;
            const showDrop = document.getElementById('filterDrop').checked;

            if (showDrop) {
                networkData.drops.forEach(drop => {
                    L.polyline([drop.from, drop.to], { color: '#a855f7', weight: 2, dashArray: '4, 4' })
                        .bindPopup(`<b>Drop</b><br>NAP: ${drop.napName}<br>Cliente: ${drop.houseName}`).addTo(mapLayers);
                });
            }
            if (showFdt) {
                networkData.fdts.forEach(fdt => {
                    let html = `<div style="background:#0284c7; color:white; padding:5px; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:bold; border:2px solid white;">🗄️</div>`;
                    L.marker([fdt.lat, fdt.lng], { icon: L.divIcon({ className: 'fdt', html, iconSize: [28,28] }) })
                        .bindPopup(`<b>FDT: ${fdt.name}</b><br>Troncal: ${fdt.feeder}`).addTo(mapLayers);
                });
            }
            if (showNap) {
                networkData.naps.forEach(nap => {
                    let html = `<div style="background:#eab308; color:black; padding:4px; border-radius:4px; font-size:10px; font-weight:bold; border:1px solid white;">📦 ${nap.name}</div>`;
                    L.marker([nap.lat, nap.lng], { icon: L.divIcon({ className: 'nap', html }) })
                        .bindPopup(`<b>NAP: ${nap.name}</b><br>Manzana: ${nap.block}<br>FDT: ${nap.fdt}`).addTo(mapLayers);
                });
            }
            if (showHouse) {
                networkData.houses.forEach(house => {
                    let color = house.status === 'Activo' ? '#22c55e' : (house.status === 'Disponible' ? '#3b82f6' : '#eab308');
                    let html = `<div style="background:${color}; width:12px; height:12px; border-radius:50%; border:2px solid white;"></div>`;
                    L.marker([house.lat, house.lng], { icon: L.divIcon({ className: 'house', html, iconSize: [12,12] }) })
                        .bindPopup(`<b>Cliente: ${house.client}</b><br>Manzana: ${house.block} | Casa: ${house.houseNum}<br>Estado: ${house.status}`).addTo(mapLayers);
                });
            }

            renderKmlItems();
        }

        // Renderizar elementos KML interactivos y editables
        function renderKmlItems() {
            kmlImportLayer.clearLayers();
            if(!document.getElementById('filterKml').checked) return;

            networkData.kmlItems.forEach((item, index) => {
                let layer;
                if(item.type === 'point') {
                    let html = `<div style="background:#f59e0b; color:black; padding:4px; border-radius:4px; font-size:10px; font-weight:bold; border:1px solid white;">📍 ${item.name}</div>`;
                    layer = L.marker(item.coords, { icon: L.divIcon({ className: 'kml-pt', html }) });
                } else if(item.type === 'polyline') {
                    layer = L.polyline(item.coords, { color: '#f59e0b', weight: 3, opacity: 0.8 });
                } else if(item.type === 'polygon') {
                    layer = L.polygon(item.coords, { color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: 0.2 });
                }

                if(layer) {
                    layer.bindPopup(`
                        <div style="font-family: sans-serif; font-size: 12px;">
                            <b>Traza KML:</b> <span id="lbl-${index}">${item.name}</span><br><br>
                            <div id="edit-box-${index}">
                                <input type="text" id="inp-${index}" value="${item.name}" class="bg-slate-700 text-white p-1 rounded border border-slate-600 text-xs mb-1" style="width:130px;">
                                <button onclick="renameKmlItem(${index})" class="bg-sky-600 text-white px-2 py-0.5 rounded text-xs">Renombrar</button>
                            </div>
                        </div>
                    `);
                    kmlImportLayer.addLayer(layer);
                }
            });
        }

        // Renombrar elemento KML
        window.renameKmlItem = function(index) {
            const newVal = document.getElementById(`inp-${index}`).value.trim();
            if(newVal) {
                networkData.kmlItems[index].name = newVal;
                localStorage.setItem('isp_inter_bqto_data', JSON.stringify(networkData));
                updateLayers();
                alert('¡Nombre actualizado con éxito!');
            }
        };

        // Importar y convertir KML de My Maps a objetos editables
        function importKmlMyMaps(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const kmlText = e.target.result;
                let parsedLayer = omnivore.kml.parse(kmlText);
                
                let addedCount = 0;
                parsedLayer.eachLayer(function(layer) {
                    let name = layer.feature && layer.feature.properties && layer.feature.properties.name ? layer.feature.properties.name : `Elemento KML ${networkData.kmlItems.length + 1}`;
                    
                    if(layer instanceof L.Marker) {
                        let latlng = layer.getLatLng();
                        networkData.kmlItems.push({ type: 'point', name: name, coords: [latlng.lat, latlng.lng] });
                        addedCount++;
                    } else if(layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
                        let latlngs = layer.getLatLngs().map(ll => [ll.lat, ll.lng]);
                        networkData.kmlItems.push({ type: 'polyline', name: name, coords: latlngs });
                        addedCount++;
                    } else if(layer instanceof L.Polygon) {
                        let latlngs = layer.getLatLngs()[0].map(ll => [ll.lat, ll.lng]);
                        networkData.kmlItems.push({ type: 'polygon', name: name, coords: latlngs });
                        addedCount++;
                    }
                });

                localStorage.setItem('isp_inter_bqto_data', JSON.stringify(networkData));
                updateLayers();
                alert(`¡Se importaron y convirtieron ${addedCount} elementos del KML con éxito! Ahora puedes hacerles clic y renombrarlos.`);
            };
            reader.readAsText(file);
        }

        function toggleKmlLayer() {
            if(document.getElementById('filterKml').checked) {
                map.addLayer(kmlImportLayer);
            } else {
                map.removeLayer(kmlImportLayer);
            }
        }

        function clearMarkers() {
            if(confirm('¿Borrar todo el registro guardado?')) {
                networkData = { fdts: [], naps: [], houses: [], drops: [], kmlItems: [] };
                localStorage.removeItem('isp_inter_bqto_data');
                updateLayers();
                renderForm();
                alert('Limpieza completa.');
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(networkData, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "isp_inter_bqto_respaldo.json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function importData(event) {
            const fr = new FileReader();
            if(event.target.files[0]) {
                fr.readAsText(event.target.files[0], "UTF-8");
                fr.onload = function(e) {
                    try {
                        networkData = JSON.parse(e.target.result);
                        localStorage.setItem('isp_inter_bqto_data', JSON.stringify(networkData));
                        updateLayers();
                        renderForm();
                        alert('Respaldo JSON cargado!');
                    } catch (error) {
                        alert('Error leyendo JSON.');
                    }
                };
            }
        }

        updateLayers();
    </script>
</body>
</html>
